<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Aurora Themes Hub — Admin</title>
<!-- Root-absolute, not relative. The Worker serves this same document at two
     URLs: /admin/ (the assets binding's canonical path) and /admin (rewritten
     to /admin/ on the SUBREQUEST only, so the browser's document URL keeps no
     trailing slash). A relative "./admin.css" resolves against the document
     URL, which means /admin/admin.css from one and /admin.css — a 404 — from
     the other. The module imports inside app.js/views.js/drawer.js/review.js
     stay relative on purpose: those resolve against the module's own URL
     (/admin/app.js), which is the same from either entry. -->
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

<!-- Both screens are born hidden. Whichever one is right gets shown by the
     inline bootstrap at the bottom of this file, before the first paint.
     Marking the login screen visible here instead would show a password box
     to everyone who is already signed in, on every refresh, for as long as
     app.js takes to load — see that script's comment. -->
<div id="login-view" hidden>
  <h2>Aurora Themes Hub — Admin</h2>
  <form id="login-form">
    <input type="password" id="login-token" placeholder="ADMIN_TOKEN" autocomplete="off" />
    <button type="submit" class="primary">Sign in</button>
    <div id="login-error"></div>
  </form>
</div>

<div id="app-view" hidden>
  <header class="top">
    <h1>Aurora Themes Hub — Admin</h1>
    <nav class="stats" id="stats-bar"></nav>
    <span class="spacer"></span>
    <button id="log-btn">日志</button>
    <button id="logout-btn">退出</button>
  </header>

  <nav class="tabs">
    <button class="tab" data-tab="configs">配置</button>
    <button class="tab" data-tab="devices">创作者</button>
    <button class="tab" data-tab="reports">举报</button>
  </nav>

  <section class="toolbar" id="config-toolbar">
    <input type="text" id="config-search" placeholder="搜索名字、id 或作者" />
    <select id="config-status">
      <option value="all">全部</option>
      <option value="active">上线中</option>
      <option value="pending">待审</option>
      <option value="removed">已下架</option>
      <option value="reported">被举报</option>
    </select>
    <select id="config-sort">
      <option value="updated">最近更新</option>
      <option value="new">最新</option>
      <option value="downloads">下载量</option>
    </select>
  </section>

  <section class="toolbar" id="device-toolbar" hidden>
    <input type="text" id="device-search" placeholder="搜索昵称或 device id" />
    <select id="device-banned">
      <option value="all">全部</option>
      <option value="yes">已封禁</option>
      <option value="no">未封禁</option>
    </select>
  </section>

  <main id="tab-body"><div class="empty">加载中…</div></main>

  <footer class="pager" id="pager" hidden>
    <button id="prev-page">上一页</button>
    <span id="page-label"></span>
    <button id="next-page">下一页</button>
  </footer>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <aside class="drawer-panel" id="drawer-panel"></aside>
</div>

<!-- Runs synchronously, at the end of the body, before the document is first
     painted and long before app.js executes: a type="module" script is
     deferred, and app.js only decides which screen to show after it and every
     module it imports (views.js, drawer.js, and drawer.js's own imports) have
     been fetched and evaluated. Leaving the initial choice to app.js means one
     to several frames of the wrong screen — which for an already signed-in
     operator is a password prompt flashing on every refresh.
     This only picks the screen; app.js still corrects it from the real answer
     (a stored token that the server has since rejected lands on 401 and gets
     bounced back to login by apiFetch).
     TOKEN_KEY is duplicated from app.js on purpose — it has to be readable
     before any module loads. pages.test.js fails if the two ever drift. -->
<script>
  (function () {
    var TOKEN_KEY = "aurora_hub_admin_token";
    var signedIn = false;
    try {
      signedIn = Boolean(sessionStorage.getItem(TOKEN_KEY));
    } catch (err) {
      // Storage blocked (private mode, third-party cookie rules). Falling
      // back to the login screen is the honest guess: without storage there
      // is no session to resume.
      signedIn = false;
    }
    document.getElementById(signedIn ? "app-view" : "login-view").hidden = false;
  })();
</script>

<script type="module" src="/admin/app.js"></script>
</body>
</html>
